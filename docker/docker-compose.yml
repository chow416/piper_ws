# =============================================================================
#  PiPER 开发容器 —— 基础版
#  这份文件在任何 Linux 上都能跑（不需要 GPU 透传，走软件渲染）。
#  想让容器用上显卡，叠加 gpu overlay：
#     docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
# =============================================================================
name: piper-dev

services:
  piper:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 换源参数：海外同事改成官方源即可，见 Dockerfile 头部注释
        UBUNTU_MIRROR: "${UBUNTU_MIRROR:-mirrors.tuna.tsinghua.edu.cn}"
        ROS2_MIRROR: "${ROS2_MIRROR:-mirrors.tuna.tsinghua.edu.cn/ros2/ubuntu}"
        ROSDISTRO_MIRROR: "${ROSDISTRO_MIRROR:-mirrors.tuna.tsinghua.edu.cn/rosdistro}"
        PIP_INDEX: "${PIP_INDEX:-https://pypi.tuna.tsinghua.edu.cn/simple}"
        ENABLE_MESA_PPA: "${ENABLE_MESA_PPA:-0}"
        USER_UID: "${USER_UID:-1000}"
        USER_GID: "${USER_GID:-1000}"
    image: piper-dev:humble
    container_name: piper_dev
    hostname: piper-dev

    # ROS 2 的 DDS 发现依赖组播。宿主网络模式下，容器、宿主上的其它节点、
    # 以及同网段的其他机器可以互相看见 —— 联调时最省事。
    network_mode: host
    ipc: host

    stdin_open: true
    tty: true
    init: true
    working_dir: /ws
    command: bash

    environment:
      DISPLAY: "${DISPLAY:-:0}"
      # 通过宿主的 Xauthority cookie 访问 XWayland；比 `xhost +` 更安全。
      # 未处于桌面会话时挂载 /dev/null，容器仍可用于无界面仿真。
      XAUTHORITY: /tmp/.Xauthority
      QT_X11_NO_MITSHM: "1"
      # 想让渲染强制走 CPU 软件光栅（排查显卡问题时用）时设为 1
      LIBGL_ALWAYS_SOFTWARE: "${LIBGL_ALWAYS_SOFTWARE:-0}"
      ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-0}"
      RMW_IMPLEMENTATION: "${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}"
      PIPER_QUIET: "${PIPER_QUIET:-0}"

    volumes:
      # X11：容器里的 RViz / Gazebo 画到宿主的 X server（Wayland 走 XWayland 亦可）
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY:-/dev/null}:/tmp/.Xauthority:ro
      # 工作区：宿主上编辑，容器里编译运行
      - ..:/ws
      # 可选：把额外的环境变量文件挂进来，改完重启容器即可生效，无需重建镜像
      - ./piper_env.sh:/etc/piper_env.sh:ro

    # ── 设备透传 ──────────────────────────────────────────────────────
    #
    # ⚠️ 容器默认看不到宿主任何字符设备。但 SocketCAN **不**受此影响 ——
    #    can0 是网络接口，走的是上面 network_mode: host，所以 CAN 一直可用，
    #    而相机（/dev/video*，字符设备）不行。两者机制不同，别搞混。
    #
    # 为什么用 privileged 而不是写死 `devices: - /dev/video2`：
    #   · /dev/videoN 的编号随插拔顺序、拓展坞上电顺序变，写死后某天会直接
    #     起不来 —— devices 里写不存在的节点是**硬报错**，不是警告
    #   · 实测 privileged 能拿到宿主全部设备（含任意 /dev/videoN）
    #
    # ⚠️ 实测：即使 privileged，容器里也**没有** /dev/v4l/by-id/ 这个软链目录
    #    （/dev 是 tmpfs，只重建了设备节点，不重建 udev 的软链树）。
    #    所以容器内一律用 /dev/videoN，认设备要靠
    #    `v4l2-ctl --list-devices` 按名字找，不能靠 by-id。
    privileged: true

    # 更克制、但要求节点号固定的替代写法（和上面二选一）：
    # device_cgroup_rules:
    #   - 'c 81:* rmw'          # 81 = video4linux 主设备号
    # devices:
    #   - /dev/video2:/dev/video2
    # ⚠️ 注意 device_cgroup_rules 单独用**不够** —— 它只加 cgroup 权限，
    #    不会在容器里创建节点，实测容器里仍然 /dev/video* 不存在。
    #    必须配 devices: 一起用（而 devices: 又要求节点当下存在）。

    restart: "no"
