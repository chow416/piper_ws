name: piper-training
services:
  train:
    build:
      context: .
      dockerfile: Dockerfile.training
      network: host
    image: piper-training:cpu
    init: true
    network_mode: host
    cpus: 6
    mem_limit: 8g
    volumes:
      - ../src:/ws/src:ro
      - ../data:/ws/data:ro
      - ../models:/ws/models:rw
    command:
      - --dataset
      - /ws/data/button_dataset_v1
      - --output
      - /ws/models/button_ssdlite_v1
      - --epochs
      - "30"
      - --threads
      - "6"
