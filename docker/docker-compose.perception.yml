name: piper-perception
services:
  perception:
    image: piper-training:cpu
    container_name: piper_button_perception
    init: true
    network_mode: host
    ipc: host
    volumes:
      - ..:/ws
    entrypoint: ["/bin/bash", "-lc"]
    command:
      - >-
        source /opt/ros/humble/setup.bash;
        source /ws/install/setup.bash;
        export PYTHONPATH=/opt/button-venv/lib/python3.10/site-packages:/usr/lib/python3/dist-packages:$$PYTHONPATH;
        exec /opt/button-venv/bin/python -m piper_button_perception.button_target_node
        --ros-args --params-file
        /ws/install/piper_button_perception/share/piper_button_perception/config/button_target.yaml
    restart: "no"
